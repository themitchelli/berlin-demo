<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Million Lives Experiment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <div class="field fill">
      <canvas id="field"></canvas>
    </div>

    <aside class="side">
      <h1>The Million Lives Experiment</h1>

      <section class="stats">
        <div id="age">Age 0</div>
        <div id="alive">1,000,000</div>
        <div class="stats-row">
          <span id="pct">100.0%</span>
          <span class="stat">Improved survivors <span id="aliveImproved">—</span></span>
          <span class="stat">Extra survivors <span id="extra">—</span></span>
        </div>
      </section>

      <div id="legend" class="legend" hidden>
        <span><i class="swatch" style="background:#7fd1ff"></i>Baseline</span>
        <span><i class="swatch" style="background:#ffb347"></i>Improved</span>
      </div>

      <div class="chart fill">
        <canvas id="chart"></canvas>
      </div>
    </aside>

    <section class="controls">
      <label>Sex
        <select id="sex">
          <option value="male" selected>male</option>
          <option value="female">female</option>
        </select>
      </label>
      <label>Starting age
        <input type="number" id="startAge" min="0" max="90" value="0">
      </label>
      <button id="play" type="button">Play</button>
      <button id="pause" type="button">Pause</button>
      <button id="reset" type="button">Reset</button>
      <label>Mortality improvement <input type="range" id="improvement" min="0" max="30" step="1" value="0"> <span id="improvementValue">0%</span></label>
    </section>
  </div>
  <script type="module" src="src/app.mjs"></script>
</body>
</html>
